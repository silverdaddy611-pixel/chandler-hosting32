<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chand Moderation Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 30px;
    }

    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #374151;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #22c55e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      background: #6b7280;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
    }

    .success {
      background: #166534;
    }

    .error {
      background: #991b1b;
    }

    .report {
      background: #374151;
      padding: 15px;
      border-radius: 8px;
      margin-top: 12px;
    }

    .report strong {
      color: #22c55e;
    }

    .refresh {
      background: #2563eb;
    }

    .refresh:hover {
      background: #1d4ed8;
    }

    .status-select {
      margin-top: 15px;
    }

    .status-button {
      background: #f59e0b;
      margin-top: 10px;
    }

    .loading {
      color: #9ca3af;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Chand Moderation Dashboard</h1>

    <p class="subtitle">
      Submit and manage moderation reports
    </p>

    <!-- Submit Report -->
    <div class="card">

      <h2>Submit a Report</h2>

      <form id="reportForm">

        <label for="phone_number">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone_number"
          placeholder="+2348012345678"
          required
        >

        <label for="reason">
          Reason
        </label>

        <select id="reason" required>
          <option value="">Select a reason</option>
          <option value="Spam">Spam</option>
          <option value="Harassment">Harassment</option>
          <option value="Scam">Scam</option>
          <option value="Impersonation">Impersonation</option>
          <option value="Abusive Content">Abusive Content</option>
          <option value="Other">Other</option>
        </select>

        <label for="details">
          Details
        </label>

        <textarea
          id="details"
          placeholder="Describe the issue..."
        ></textarea>

        <button
          type="submit"
          id="submitButton"
        >
          Submit Report
        </button>

      </form>

      <div id="message"></div>

    </div>


    <!-- Submitted Reports -->
    <div class="card">

      <h2>Submitted Reports</h2>

      <button
        type="button"
        class="refresh"
        id="refreshButton"
      >
        Refresh Reports
      </button>

      <div id="reports">
        <div class="loading">
          Loading reports...
        </div>
      </div>

    </div>

  </div>


  <script>

    // Backend API
    const API_URL =
      "https://chand-app-api.onrender.com";


    const form =
      document.getElementById("reportForm");

    const message =
      document.getElementById("message");

    const reportsContainer =
      document.getElementById("reports");

    const submitButton =
      document.getElementById("submitButton");

    const refreshButton =
      document.getElementById("refreshButton");


    // =========================
    // SUBMIT REPORT
    // =========================

    form.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const phone_number =
          document
            .getElementById("phone_number")
            .value
            .trim();

        const reason =
          document
            .getElementById("reason")
            .value;

        const details =
          document
            .getElementById("details")
            .value
            .trim();


        if (!phone_number || !reason) {

          message.className = "error";

          message.textContent =
            "Phone number and reason are required.";

          return;

        }


        submitButton.disabled = true;

        submitButton.textContent =
          "Submitting...";


        try {

          const response =
            await fetch(
              `${API_URL}/reports`,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  phone_number:
                    phone_number,

                  reason:
                    reason,

                  details:
                    details
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.message ||
              "Could not submit report."
            );

          }


          message.className =
            "success";

          message.textContent =
            "Report submitted successfully!";


          form.reset();


          await loadReports();


        } catch (error) {

          console.error(
            "Submit error:",
            error
          );


          message.className =
            "error";

          message.textContent =
            error.message ||
            "Connection error. Please try again.";

        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "Submit Report";

        }

      }
    );


    // =========================
    // LOAD REPORTS
    // =========================

    async function loadReports() {

      reportsContainer.innerHTML =
        '<div class="loading">Loading reports...</div>';


      try {

        const response =
          await fetch(
            `${API_URL}/reports`
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Could not load reports."
          );

        }


        if (
          !data.reports ||
          data.reports.length === 0
        ) {

          reportsContainer.innerHTML =
            '<div class="loading">No reports submitted yet.</div>';

          return;

        }


        reportsContainer.innerHTML =
          "";


        data.reports.forEach(
          function(report) {

            const div =
              document.createElement("div");

            div.className =
              "report";


            div.innerHTML = `

              <strong>Phone:</strong>
              ${escapeHtml(
                report.phone_number || ""
              )}

              <br><br>

              <strong>Reason:</strong>
              ${escapeHtml(
                report.reason || ""
              )}

              <br><br>

              <strong>Details:</strong>
              ${escapeHtml(
                report.details || "None"
              )}

              <br><br>

              <strong>Current Status:</strong>
              ${escapeHtml(
                report.status || "pending"
              )}

              <br>

              <label>
                Change Status
              </label>

              <select
                class="status-select"
                data-id="${report.id}"
              >

                <option
                  value="pending"
                  ${report.status === "pending" ? "selected" : ""}
                >
                  Pending
                </option>

                <option
                  value="reviewed"
                  ${report.status === "reviewed" ? "selected" : ""}
                >
                  Reviewed
                </option>

                <option
                  value="resolved"
                  ${report.status === "resolved" ? "selected" : ""}
                >
                  Resolved
                </option>

                <option
                  value="rejected"
                  ${report.status === "rejected" ? "selected" : ""}
                >
                  Rejected
                </option>

              </select>

              <button
                class="status-button"
                onclick="updateStatus(${report.id}, this)"
              >
                Update Status
              </button>

            `;


            reportsContainer.appendChild(
              div
            );

          }
        );


      } catch (error) {

        console.error(
          "Load reports error:",
          error
        );


        reportsContainer.innerHTML = `
          <div class="loading">
            Could not connect to the API.
          </div>
        `;

      }

    }


    // =========================
    // UPDATE REPORT STATUS
    // =========================

    async function updateStatus(
      reportId,
      button
    ) {

      const select =
        document.querySelector(
          `.status-select[data-id="${reportId}"]`
        );


      const newStatus =
        select.value;


      button.disabled =
        true;

      button.textContent =
        "Updating...";


      try {

        const response =
          await fetch(
            `${API_URL}/reports/${reportId}/status`,
            {
              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                status:
                  newStatus
              })
            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          throw new Error(
            data.message ||
            "Could not update status."
          );

        }


        alert(
          "Report status updated successfully!"
        );


        await loadReports();


      } catch (error) {

        console.error(
          "Status update error:",
          error
        );


        alert(
          error.message ||
          "Could not update report status."
        );

      } finally {

        button.disabled =
          false;

        button.textContent =
          "Update Status";

      }

    }


    // =========================
    // ESCAPE HTML
    // =========================

    function escapeHtml(value) {

      const div =
        document.createElement("div");

      div.textContent =
        value;

      return div.innerHTML;

    }


    // =========================
    // REFRESH BUTTON
    // =========================

    refreshButton.addEventListener(
      "click",
      loadReports
    );


    // =========================
    // LOAD REPORTS ON START
    // =========================

    loadReports();

  </script>

</body>
          </html>
